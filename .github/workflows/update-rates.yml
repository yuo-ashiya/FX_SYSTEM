name: Update FX Rates

on:
  schedule:
    # 毎時 8分, 23分, 38分, 53分 に実行(ちょうどの時刻は世界中のcronが集中し遅延しやすいため、あえてずらしている)
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch: {}   # Actionsタブから手動実行もできるようにする

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest rates and check alerts
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: python fetch_rates.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rates.json alert_state.json
          if git diff --staged --quiet; then
            echo "変更なし。コミットはスキップします。"
            exit 0
          fi
          git commit -m "Update FX rates [skip ci]"

          # 複数の実行が同時に走ってpushが衝突した場合に備え、pull(rebase)してリトライする
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push成功"
              exit 0
            fi
            echo "pushが衝突したため、pullしてリトライします ($i回目)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $(( (RANDOM % 10) + 3 ))
          done

          echo "リトライしてもpushに失敗しました"
          exit 1
