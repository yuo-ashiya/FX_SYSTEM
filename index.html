<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通貨ペア モニタリング</title>
<style>
  body {
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 12px;
    color: #222;
  }
  h1 { font-size: 18px; margin: 4px 4px 8px; }
  .updated { font-size: 12px; color: #666; margin: 0 4px 4px; }
  .note { font-size: 11px; color: #888; margin: 0 4px 12px; }
  .error { color: #b00020; font-size: 12px; margin: 0 4px 10px; }
  table {
    border-collapse: collapse;
    width: 100%;
    background: #fff;
    font-size: 14px;
  }
  th, td {
    border: 1px solid #cfd8dc;
    padding: 6px 8px;
    text-align: center;
    white-space: nowrap;
  }
  th {
    background: #37474f;
    color: #fff;
    font-weight: 600;
  }
  td.pair { text-align: left; font-weight: 600; }
  input.thresh {
    width: 64px;
    padding: 3px;
    border: 1px solid #b0bec5;
    border-radius: 4px;
    text-align: center;
  }
  button {
    padding: 5px 12px;
    border: none;
    border-radius: 4px;
    background: #1565c0;
    color: #fff;
    font-size: 12px;
    cursor: pointer;
  }
  button:active { background: #0d47a1; }
  button.save { padding: 4px 10px; }
  .over    { background: #ffcdd2 !important; }
  .under   { background: #bbdefb !important; }
  .wrap { overflow-x: auto; }
  .toolbar { margin: 4px 0 12px; }
</style>
</head>
<body>
  <h1>通貨ペア モニタリング</h1>
  <div class="updated" id="updated">読み込み中...</div>
  <div class="note">上限超え=赤、下限割れ=青 / データはGitHub Actionsが定期取得(目安15分毎)</div>
  <div class="error" id="error" style="display:none;"></div>
  <div class="toolbar"><button id="refreshBtn">今すぐ再取得</button></div>
  <div class="wrap">
  <table>
    <thead>
      <tr>
        <th>通貨ペア</th>
        <th>現在値</th>
        <th>アラート上限</th>
        <th>アラート下限</th>
        <th>保存</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  </div>

<script>
const PAIRS = [
  "USD/JPY", "EUR/JPY", "GBP/JPY", "AUD/JPY",
  "EUR/USD", "GBP/USD", "AUD/USD", "EUR/GBP",
  "CHF/TRY", "TRY/JPY", "CHF/MXN", "MXN/JPY"
];

const DECIMALS = {
  "USD/JPY": 3, "EUR/JPY": 3, "GBP/JPY": 3, "AUD/JPY": 3,
  "EUR/USD": 5, "GBP/USD": 5, "AUD/USD": 5, "EUR/GBP": 5,
  "CHF/TRY": 3, "TRY/JPY": 4, "CHF/MXN": 3, "MXN/JPY": 4
};

const STORAGE_KEY = "fx_thresholds_v1";

function loadThresholds() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {
    console.warn("localStorageが使えない環境のため、設定は保存されません", e);
  }
  const empty = {};
  PAIRS.forEach(p => empty[p] = { upper: null, lower: null });
  return empty;
}

function saveThresholds(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn("localStorageへの保存に失敗しました", e);
  }
}

let thresholds = loadThresholds();

function fmt(pair, val) {
  if (val === null || val === undefined) return "--";
  const d = DECIMALS[pair] !== undefined ? DECIMALS[pair] : 4;
  return Number(val).toFixed(d);
}

function buildTable() {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  PAIRS.forEach(pair => {
    const t = thresholds[pair] || { upper: null, lower: null };
    const tr = document.createElement("tr");
    tr.dataset.pair = pair;
    tr.innerHTML = `
      <td class="pair">${pair}</td>
      <td class="rateval">--</td>
      <td><input class="thresh upper" type="number" step="any" placeholder="上限" value="${t.upper ?? ""}"></td>
      <td><input class="thresh lower" type="number" step="any" placeholder="下限" value="${t.lower ?? ""}"></td>
      <td><button class="save">保存</button></td>
    `;
    tbody.appendChild(tr);

    tr.querySelector(".save").addEventListener("click", () => {
      const upperInput = tr.querySelector(".upper");
      const lowerInput = tr.querySelector(".lower");
      const upper = upperInput.value === "" ? null : parseFloat(upperInput.value);
      const lower = lowerInput.value === "" ? null : parseFloat(lowerInput.value);
      thresholds[pair] = { upper, lower };
      saveThresholds(thresholds);
      applyColorForRow(tr);
    });
  });
}

function applyColorForRow(tr) {
  const pair = tr.dataset.pair;
  const rateCell = tr.querySelector(".rateval");
  const val = rateCell.dataset.val ? parseFloat(rateCell.dataset.val) : null;
  const upperInput = tr.querySelector(".upper");
  const lowerInput = tr.querySelector(".lower");
  const upper = upperInput.value;
  const lower = lowerInput.value;

  rateCell.classList.remove("over", "under");
  if (val === null || isNaN(val)) return;
  if (upper !== "" && !isNaN(upper) && val > parseFloat(upper)) {
    rateCell.classList.add("over");
  } else if (lower !== "" && !isNaN(lower) && val < parseFloat(lower)) {
    rateCell.classList.add("under");
  }
}

function toJstString(epochSeconds) {
  const d = new Date(epochSeconds * 1000);
  return d.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" }) + " (JST)";
}

async function refreshRates() {
  const errBox = document.getElementById("error");
  try {
    // キャッシュを避けるため毎回タイムスタンプ付きで取得
    const res = await fetch("./rates.json?t=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    document.getElementById("updated").textContent =
      "最終更新: " + toJstString(data.updated_at_epoch);
    errBox.style.display = "none";

    document.querySelectorAll("tbody tr").forEach(tr => {
      const pair = tr.dataset.pair;
      const val = data.rates[pair];
      const rateCell = tr.querySelector(".rateval");
      rateCell.textContent = fmt(pair, val);
      rateCell.dataset.val = (val === null || val === undefined) ? "" : val;
      applyColorForRow(tr);
    });
  } catch (e) {
    errBox.style.display = "block";
    errBox.textContent = "rates.jsonの取得に失敗しました: " + e.message +
      "(GitHub Actionsがまだ一度も実行されていない可能性があります)";
  }
}

buildTable();
refreshRates();
document.getElementById("refreshBtn").addEventListener("click", refreshRates);
</script>
</body>
</html>
