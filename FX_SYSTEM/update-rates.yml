name: Update FX Rates

on:
  schedule:
    # 15分おきに実行(GitHub側の負荷状況により数分遅れることがあります)
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # Actionsタブから手動実行もできるようにする

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest rates
        run: python fetch_rates.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git diff --staged --quiet || git commit -m "Update FX rates [skip ci]"
          git push
